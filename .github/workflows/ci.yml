name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Reject legacy backend and hard-coded UPI destinations
        run: |
          ! grep -R -nE 'nerdpixel\.workers\.dev|Appwrite|appwrite|souravpbijoy-[0-9]+@' src
      - name: Build production container
        run: docker build -t payment-frontend:ci .
